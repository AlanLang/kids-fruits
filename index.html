<script>
(() => {
'use strict';
const {createRound,availableTiles}=FruitGame;
const $=id=>document.getElementById(id), board=$('board'), garden=$('garden');
let level=1,remaining=3,selected=null,locked=false,sound=true,audio=null,idleTimer=null,round=0;
let currentRound=null,previousSignature='';
const tileButtons=new Map();
function refreshTiles(){
  const open=new Set(availableTiles(currentRound.tiles).map(tile=>tile.id));
  currentRound.tiles.forEach(tile=>{
    const button=tileButtons.get(tile.id),covered=!tile.removed&&!open.has(tile.id);
    button.disabled=tile.removed||covered;
    button.classList.toggle('covered',covered);
    button.setAttribute('aria-label',covered?'被盖住的图案':`${tile.fruit.name}，第 ${tile.id+1} 张`);
    button.querySelector('.picture').toggleAttribute('hidden',covered);
    button.querySelector('.tile-back').hidden=!covered;
  });
}
function resizeBoard(){
  if(!currentRound||$('game').hidden)return;
  const tiles=currentRound.tiles,landscape=board.clientWidth>board.clientHeight*1.35;
  const coordinates=tiles.map(t=>({tile:t,x:landscape?t.y:t.x,y:landscape?t.x:t.y}));
  const width=Math.max(...coordinates.map(p=>p.x+1)),height=Math.max(...coordinates.map(p=>p.y+1));
  const size=Math.max(1,Math.floor(Math.min(board.clientWidth/width,board.clientHeight/height)));
  const left=(board.clientWidth-width*size)/2,top=(board.clientHeight-height*size)/2;
  coordinates.forEach(({tile,x,y})=>{
    const button=tileButtons.get(tile.id);
    button.style.left=`${left+x*size}px`;button.style.top=`${top+y*size}px`;
    button.style.width=`${size}px`;button.style.height=`${size}px`;
  });
}
new ResizeObserver(resizeBoard).observe(board);
const timers=new Set();
function later(fn,ms){const t=setTimeout(()=>{timers.delete(t);fn();},ms);timers.add(t);return t;}
function activateAudio(){if(!sound)return;try{if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audio=new Audio();}if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(_){}}
function chime(kind){if(!sound||!audio||audio.state!=='running')return;try{const notes=kind==='win'?[523.25,659.25,783.99,1046.5]:kind==='match'?[659.25,880,1046.5]:[523.25];const now=audio.currentTime;notes.forEach((freq,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),start=now+i*.115;osc.type='sine';osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.095,start+.015);gain.gain.exponentialRampToValueAtTime(.001,start+.27);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+.3);osc.onended=()=>{osc.disconnect();gain.disconnect();};});}catch(_){}}
function idle(){clearTimeout(idleTimer);if($('game').hidden||document.hidden||locked||!$('win').hidden)return;if(remaining>0)idleTimer=setTimeout(()=>showHint(false),9000);}
function clearHints(){board.querySelectorAll('.hint').forEach(el=>el.classList.remove('hint'));}
function showHint(manual=true){
  if(locked||$('game').hidden||!$('win').hidden)return;
  if(manual)activateAudio();clearHints();
  const available=availableTiles(currentRound.tiles).map(tile=>tileButtons.get(tile.id));
  let first=selected;
  if(!first||!available.some(el=>el!==first&&el.dataset.fruit===first.dataset.fruit)){
    if(selected){selected.classList.remove('selected');selected.setAttribute('aria-pressed','false');selected=null;}
    first=available.find(el=>available.some(other=>other!==el&&other.dataset.fruit===el.dataset.fruit));
  }
  if(!first)return;
  available.filter(el=>el.dataset.fruit===first.dataset.fruit).forEach(el=>{void el.offsetWidth;el.classList.add('hint');});
  $('feedback').textContent='亮起来的两个，是好朋友哦！';clearTimeout(idleTimer);idleTimer=setTimeout(()=>showHint(false),12000);
}
function drawConnection(a,b){const rect=garden.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();const x1=ra.left+ra.width/2-rect.left,y1=ra.top+ra.height/2-rect.top,x2=rb.left+rb.width/2-rect.left,y2=rb.top+rb.height/2-rect.top;const svg=$('connections');svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);const middle=(x1+x2)/2;const d=`M ${x1} ${y1} C ${middle} ${y1}, ${middle} ${y2}, ${x2} ${y2}`;svg.innerHTML=`<path class="connection-back" d="${d}"/><path class="connection" d="${d}"/>`;for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'✦':'✧';s.style.color='var(--yellow)';s.style.left=`${(x1+x2)/2}px`;s.style.top=`${(y1+y2)/2}px`;s.style.setProperty('--dx',`${Math.cos(i/7*Math.PI*2)*65}px`);s.style.setProperty('--dy',`${Math.sin(i/7*Math.PI*2)*65-25}px`);garden.append(s);later(()=>s.remove(),850);}}
function choose(tile){if(locked||tile.disabled||$('game').hidden||tile.classList.contains('gone')||!$('win').hidden)return;activateAudio();clearHints();clearTimeout(idleTimer);if(selected===tile){selected.classList.remove('selected');selected.setAttribute('aria-pressed','false');selected=null;idle();return;}tile.classList.add('selected');tile.setAttribute('aria-pressed','true');if(!selected){selected=tile;chime('tap');$('feedback').textContent=`再找一个${tile.dataset.name}吧！`;idle();return;}const first=selected;selected=null;if(first.dataset.fruit!==tile.dataset.fruit){first.classList.remove('selected');first.setAttribute('aria-pressed','false');selected=tile;$('feedback').textContent=`一起找找另一个${tile.dataset.name}吧！`;idle();return;}locked=true;drawConnection(first,tile);chime('match');$('feedback').textContent=['找到啦！真棒！','手拉手，好朋友！','叮！水果找到朋友啦！'][Math.floor(Math.random()*3)];later(()=>{[first,tile].forEach(el=>el.classList.add('vanish'));},360);later(()=>{[first,tile].forEach(el=>{el.className='fruit gone';el.disabled=true;el.setAttribute('aria-pressed','false');el.setAttribute('aria-hidden','true');currentRound.tiles[Number(el.dataset.tile)].removed=true;});refreshTiles();$('connections').innerHTML='';remaining--;$('remaining').textContent=remaining?`还剩 ${remaining} 对`:'全部找到啦！';locked=false;if(!remaining){later(finish,400);}else{idle();}},950);}
function finish(){clearTimeout(idleTimer);$('win-text').textContent=`第 ${level} 关完成，藏起来的朋友都找到啦！`;$('win').hidden=false;chime('win');$('next').focus({preventScroll:true});}
function start(n=level){
  timers.forEach(clearTimeout);timers.clear();clearTimeout(idleTimer);round++;level=n;
  currentRound=createRound(level,previousSignature);previousSignature=currentRound.signature;
  remaining=currentRound.pairs;selected=null;locked=false;
  $('win').hidden=true;$('connections').innerHTML='';garden.querySelectorAll('.spark').forEach(el=>el.remove());
  $('home').hidden=true;$('game').hidden=false;
  $('level').textContent=`第 ${level} 关`;$('remaining').textContent=`还剩 ${remaining} 对`;
  $('feedback').textContent=`${currentRound.theme} · 先找最上面的朋友`;
  board.replaceChildren();tileButtons.clear();
  currentRound.tiles.forEach(tile=>{
    const f=tile.fruit,button=document.createElement('button');
    button.id=`fruit-${round}-${tile.id}`;button.className='fruit';button.dataset.tile=tile.id;
    button.dataset.fruit=f.id;button.dataset.name=f.name;button.style.zIndex=tile.z+1;
    button.setAttribute('aria-pressed','false');
    button.innerHTML=`<svg class="picture" viewBox="0 0 100 100" aria-hidden="true"><use href="#${f.id}"/></svg><span class="tile-back" aria-hidden="true">✿</span>`;
    button.addEventListener('click',()=>choose(button));tileButtons.set(tile.id,button);board.append(button);
  });
  refreshTiles();resizeBoard();idle();
}
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'♫':'♪̸';$('sound').setAttribute('aria-label',sound?'关闭音效':'打开音效');$('sound').setAttribute('aria-pressed',String(sound));if(sound){activateAudio();chime('tap');}});
$('play').addEventListener('click',()=>{activateAudio();start();});
$('home-button').addEventListener('click',()=>{timers.forEach(clearTimeout);timers.clear();clearTimeout(idleTimer);$('game').hidden=true;$('home').hidden=false;$('win').hidden=true;$('play').focus({preventScroll:true});});
$('hint').addEventListener('click',()=>showHint());$('restart').addEventListener('click',()=>start());$('next').addEventListener('click',()=>{activateAudio();start(level+1);});$('easy').addEventListener('click',()=>start(1));
$('win').addEventListener('keydown',e=>{if(e.key==='Tab'){const next=$('next'),easy=$('easy');if(e.shiftKey&&document.activeElement===next){e.preventDefault();easy.focus();}else if(!e.shiftKey&&document.activeElement===easy){e.preventDefault();next.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(idleTimer);if(audio&&audio.state==='running')audio.suspend().catch(()=>{});}else idle();});
})();
</script>
